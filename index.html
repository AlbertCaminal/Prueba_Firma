<!doctype html>
<html lang="es">

          <td

              target="_blank"
              style="text-decoration: none"
            >
              <img
                src="https://tresipunt.com/emailHub/imagen1.png"
                width="200"
                style="
                  display: block;
                  border: 0;
                  width: 70px;
                  height: auto;
                  background-color: #ffffff;
                "
              />

              target="_blank"
              style="text-decoration: none"
            >
              <img
                src="https://tresipunt.com/emailHub/imagen2.png"
                width="200"
                style="
                  display: block;
                  border: 0;
                  width: 200px;
                  height: auto;
                  background-color: #ffffff;
                "
              />
            </a>
          </td>
          <td rowspan="2" style="padding-left: 20px; vertical-align: top">
            <a
              href="https://tresipunt.com/emailHub/link-firma/?utm_source=firma-email&utm_medium=email&utm_campaign=congres&utm_content=banner_promo"

                width: 75px;
                height: auto;
                background-color: #ffffff;
              "
            />
          </td>
        </tr>
      </table>
    </div>
    <script>
      document
        .querySelectorAll('a[href*="emailHub/link-"]')
        .forEach(function (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            var href = this.getAttribute("href");
            setTimeout(function () {
              window.open(href, "_blank");
            }, 200);
          });
        });
    </script>
